name: Deploy to VM

# One-time setup before this works:
#   1. In GitHub repo Settings -> Secrets and variables -> Actions, add:
#        DOCKERHUB_USERNAME   your Docker Hub username
#        cloud-Badges
#       DOCKERHUB_TOKEN      a Docker Hub token (see README)
#        SSH_HOST             VM's public IP or hostname
#        SSH_USER             SSH username (e.g. root, ubuntu)
#        SSH_KEY              private key that can SSH into the VM
#        SITE_ADDRESS         e.g. 47-253-1-100.sslip.io (see README)
#   2. The Alibaba VM only needs Docker installed
#
# Fill in the blanks below (see curriculum Day 2 Session 2).

on:
  push:
    branches: [main] # <-- which branch triggers a deploy?

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_USERNAME }} # <-- which secret holds the Docker Hub token?
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/cloud-Badges:latest

  deploy:
    needs: build-and-push # <-- this job must wait for which job?
    runs-on: ubuntu-latest
    steps:
      - name: SSH and redeploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            docker rm -f cloud-Badges || true
            docker run -d --pull always -p 80:80 -p 443:443 \
              -e SITE_ADDRESS=${{ secrets.SITE_ADDRESS }} \
              --name cloud-Badges ${{ secrets.DOCKERHUB_USERNAME }}/cloud-Badges:latest


<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>__OG_TITLE__</title>
    <style>
      .page-heading .pod-name {
        font-family: "Space Grotesk", monospace;
        font-size: 12px;
        color: rgba(245, 245, 247, 0.45);
      }
    </style>

    <!-- og:image is filled in at request time by Caddy's `templates`
         directive (see Caddyfile) - the domain isn't known until
         `docker run`, so it can't be baked in at build time. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="__OG_TITLE__" />
    <meta property="og:description" content="__OG_DESCRIPTION__" />
    <meta
      property="og:image"
      content='https://{{ placeholder "http.request.host" }}/og-image.png'
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Filled in at request time the same way as og:image above, but reads
         the POD_NAME env var (set via the Kubernetes Downward API) instead
         of a request placeholder - empty outside a Pod, e.g. `docker run`. -->
    <meta name="pod-name" content="{{env "POD_NAME"}}" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
